services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduva
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - eduva-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduva"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/eduva?schema=public
      MOCK_PAYMENT_BASE_URL: http://admin:4000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      DOCUMENT_SCAN_REQUIRED: ${DOCUMENT_SCAN_REQUIRED:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - eduva-uploads:/app/storage

  admin:
    build:
      context: .
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    restart: unless-stopped
    command: ["node", "admin-server/server.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/eduva?schema=public
      ADMIN_HOST: 0.0.0.0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      DOCUMENT_SCAN_REQUIRED: ${DOCUMENT_SCAN_REQUIRED:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - eduva-uploads:/app/storage
      - eduva-admin-config:/app/admin-server/data

  # Optional container profile: start with --profile malware-scanning.
  # No published TCP port: clamd's plaintext INSTREAM protocol must remain internal.
  clamav:
    image: clamav/clamav:stable
    profiles: ["malware-scanning"]
    restart: unless-stopped
    volumes:
      - eduva-clamav-db:/var/lib/clamav

volumes:
  eduva-clamav-db:
  eduva-db:
  eduva-uploads:
  eduva-admin-config:

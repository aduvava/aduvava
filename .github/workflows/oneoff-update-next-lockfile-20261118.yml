name: One-time refresh Next.js security lockfile
on:
  push:
    branches:
      - fix/security-deploy-unblock-20261118
    paths:
      - .github/workflows/oneoff-update-next-lockfile-20261118.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.repository == 'aduvava/aduvava'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update pinned Next.js version and resolve exact dependency integrity hashes
        run: npm install next@16.4.6 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to only this maintenance branch
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: update Next.js to patched 16.4.6"
            git push origin HEAD:refs/heads/fix/security-deploy-unblock-20261118
          fi

name: Temporary public referral route diagnosis

on:
  push:
    branches: [diagnostic/referral-live-route-20261116]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify deployed optional 6-character VIP referral links
        shell: bash
        run: |
          set -Eeuo pipefail
          root='https://educhi.xyz'
          legacy='ECC2E5FE260C'
          status=$(curl -sS --max-time 20 -D /tmp/refhdr -o /dev/null -w '%{http_code}' "$root/r/$legacy")
          echo "old_link_status=$status"
          test "$status" = "303"
          location=$(sed -n -E 's/^[Ll]ocation: ([^\r]+).*/\1/p' /tmp/refhdr | tail -1 | tr -d '\r')
          echo "old_link_redirect=$location"
          echo "$location" | grep -Eq '^/vip\?ref=[A-Z0-9]{6}$'
          code="${location##*ref=}"
          echo "new_referral_code_length=${#code}"
          status=$(curl -sS --max-time 20 -D /tmp/newhdr -o /dev/null -w '%{http_code}' "$root/r/$code")
          test "$status" = "303"
          grep -qi "^location: /vip?ref=$code" /tmp/newhdr
          status=$(curl -sS --max-time 20 -D /tmp/viphdr -o /dev/null -w '%{http_code}' "$root/vip?ref=$code")
          echo "guest_vip_status=$status"
          test "$status" = "303"
          grep -qi 'location: .*login.*callbackUrl=' /tmp/viphdr
          echo 'PUBLIC SIX-CHAR INVITE CHECK PASSED'

name: One-time PostCSS security compatibility check
on:
  push:
    branches: [improve/security-performance]
    paths: [.github/workflows/postcss-refresh.yml]
permissions:
  contents: write
jobs:
  patch-postcss:
    if: github.repository == 'aduvava/aduvava' && github.ref == 'refs/heads/improve/security-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Re-resolve Next.js internal PostCSS to patched v8
        run: |
          npm pkg set 'overrides.next.postcss=8.5.31'
          npm pkg set 'devDependencies.postcss=8.5.31'
          npm install
          npm run db:generate
      - name: Verify compatibility (typecheck, tests and production build)
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-only-placeholder-not-for-runtime
          DATABASE_URL: postgresql://postgres:build-only@127.0.0.1:5432/eduva?schema=public
        run: |
          npx tsc --noEmit -p tsconfig.ci.json
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit validated dependency lock on this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: pin patched PostCSS within Next.js after compatibility checks"
            git fetch origin improve/security-performance
            git rebase origin/improve/security-performance
            git push origin HEAD:improve/security-performance
          fi

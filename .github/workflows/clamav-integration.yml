name: Real ClamAV integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-clamav-${{ github.ref }}
  cancel-in-progress: true

jobs:
  antivirus:
    name: Real ClamAV clean/EICAR/offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan benign bytes and harmless EICAR with real clamd
        env:
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: '3310'
          DOCUMENT_SCAN_REQUIRED: 'true'
        run: |
          node scripts/clamav-real-smoke.js

name: One-time dependency security refresh

on:
  push:
    branches: [improve/security-performance]
    paths: [.github/workflows/dependency-refresh.yml]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'aduvava/aduvava' && github.ref == 'refs/heads/improve/security-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install patched versions without forcing major upgrades
        run: |
          npm ci
          npm install --save-exact read-excel-file@9.3.14 write-excel-file@4.1.1
          npm audit fix --omit=dev || true
      - name: Commit updated dependency manifests only on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: replace SheetJS with maintained spreadsheet packages"
            git push origin HEAD:improve/security-performance
          fi

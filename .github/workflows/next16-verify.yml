name: Next 16 read-only upgrade validation
on:
  push:
    branches: [improve/security-performance]
    paths:
      - .github/workflows/next16-verify.yml
permissions:
  contents: read
jobs:
  verify-next16:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate dependency lockfile without pushing
        run: |
          npm ci
          npm install --save-exact next@16.4.3
          npm pkg set 'engines.node=>=20.9.0'
          npm install --package-lock-only
      - name: Emit dependency lockfile for review
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [key, path] of [['PACKAGE', 'package.json'], ['LOCK', 'package-lock.json']]) {
            const text = fs.readFileSync(path).toString('base64');
            for (let i = 0; i < text.length; i += 3000) {
              console.log('FILECHUNK_' + key + '_' + String(i / 3000).padStart(4, '0') + ':' + text.slice(i, i + 3000));
            }
          }
          NODE
      - name: Typecheck and unit tests
        run: |
          npm run db:generate
          npx tsc --noEmit -p tsconfig.ci.json
          npm test
      - name: Next.js 16 production build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-only-placeholder-not-for-runtime
          DATABASE_URL: postgresql://postgres:build-only@127.0.0.1:5432/eduva?schema=public
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

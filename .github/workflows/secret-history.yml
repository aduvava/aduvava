name: Secret history scan
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable Git history without exposing findings
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker pull "$image"
          status=0
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" "$image" git /repo --log-opts="--all --full-history -m" --redact=100 --no-banner --exit-code=7 > "$RUNNER_TEMP/gitleaks-private.log" 2>&1 || status=$?
          rm -f "$RUNNER_TEMP/gitleaks-private.log"
          if [ "$status" -eq 7 ]; then
            echo "::error::Potential historical secrets detected. Review privately and rotate confirmed credentials."
          elif [ "$status" -ne 0 ]; then
            echo "::error::Secret scanner could not complete."
          else
            echo "No secrets detected by configured scanner in reachable history."
          fi
          exit "$status"

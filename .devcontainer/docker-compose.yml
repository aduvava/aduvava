services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    working_dir: /workspaces/aduvava
    volumes:
      - ..:/workspaces/aduvava:cached
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduva
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: eduva_codespaces_only
    volumes:
      - eduva-codespaces-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduva"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  eduva-codespaces-db:
